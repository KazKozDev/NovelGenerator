
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovelGenerator</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Applied before the first paint so a reload does not flash the other theme.
      (function () {
        try {
          var stored = localStorage.getItem('novelGenerator_theme');
          if (stored === 'light') document.documentElement.classList.add('light');
        } catch (error) { /* private mode: the dark default is fine */ }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // The interface is written in one zinc scale. Both themes are that scale, resolved through
      // variables, so a component never spells out a colour for a particular theme.
      tailwind.config = {
        theme: {
          extend: {
            // One scale for the whole interface. Four steps carry every label, control and reading
            // in the UI; the manuscript has its own step because it is set for reading, not for use.
            // Type scale from IBM Carbon's algorithm (12, 14, 16, 18, 20, 24...), with every line
            // height snapped to the 4px baseline grid so text aligns across columns. Letter spacing
            // opens up at small sizes and closes at large ones, as the same system prescribes.
            fontSize: {
              xs: ['12px', { lineHeight: '16px', letterSpacing: '0.32px' }],  // meta, counts, helper text
              sm: ['14px', { lineHeight: '20px', letterSpacing: '0.16px' }],  // labels, secondary text
              base: ['16px', { lineHeight: '24px', letterSpacing: '0' }],     // controls and body
              lg: ['20px', { lineHeight: '28px', letterSpacing: '0' }],       // section and panel headings
              prose: ['20px', { lineHeight: '32px', letterSpacing: '0' }],    // the manuscript
              xl: ['24px', { lineHeight: '32px', letterSpacing: '0' }],       // wordmark in the studio
              '2xl': ['28px', { lineHeight: '36px', letterSpacing: '0' }],    // wordmark on the entry screen
            },
            colors: {
              zinc: {
                50: 'rgb(var(--z-50) / <alpha-value>)',
                100: 'rgb(var(--z-100) / <alpha-value>)',
                200: 'rgb(var(--z-200) / <alpha-value>)',
                300: 'rgb(var(--z-300) / <alpha-value>)',
                400: 'rgb(var(--z-400) / <alpha-value>)',
                500: 'rgb(var(--z-500) / <alpha-value>)',
                600: 'rgb(var(--z-600) / <alpha-value>)',
                700: 'rgb(var(--z-700) / <alpha-value>)',
                800: 'rgb(var(--z-800) / <alpha-value>)',
                900: 'rgb(var(--z-900) / <alpha-value>)',
                950: 'rgb(var(--z-950) / <alpha-value>)',
              },
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --z-50: 250 250 250;  --z-100: 244 244 245; --z-200: 228 228 231;
        --z-300: 212 212 216; --z-400: 161 161 170; --z-500: 113 113 122;
        /* The dark end is graphite, not black: the page sits at 950, panels at 900, lines and fields at 800. */
        --z-600: 98 99 108;   --z-700: 76 77 85;    --z-800: 58 59 66;
        --z-900: 43 44 50;    --z-950: 32 33 38;
        color-scheme: dark;
      }
      /* The same ramp, walked from the other end. */
      /* One meaningful surface: the sheet the manuscript is written on. Lighter than its ground in
         either theme, which a single palette step cannot express once the ramp is inverted. */
      :root { --sheet: 46 47 53; }
      html.light { --sheet: 255 255 255; }
      .sheet { background-color: rgb(var(--sheet)); }
      .revision-removed {
        color: #fca5a5;
        background: rgba(239, 68, 68, 0.18);
        text-decoration: line-through;
        text-decoration-color: rgba(239, 68, 68, 0.7);
        text-decoration-thickness: 1.5px;
        padding: 0.1em 0.35em;
        border-radius: 3px;
        opacity: .9;
      }
      .revision-added {
        color: #86efac;
        background: rgba(34, 197, 94, 0.2);
        text-decoration: none;
        padding: 0.1em 0.35em;
        border-radius: 3px;
        box-shadow: inset 0 -1px 0 rgba(34, 197, 94, 0.35);
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
        animation: revision-arrival 1.5s ease-out;
      }
      html.light .revision-removed {
        color: #991b1b;
        background: rgba(239, 68, 68, 0.16);
        text-decoration-color: #dc2626;
      }
      html.light .revision-added {
        color: #15803d;
        background: rgba(34, 197, 94, 0.2);
        box-shadow: inset 0 -1px 0 rgba(22, 101, 52, 0.25);
      }
      .manuscript-changes > * + * { margin-top: 1rem; }
      .revision-markdown { display: block; padding: .55rem .65rem; margin: 0; }
      .revision-markdown + .revision-markdown { margin-top: .75rem; }
      @keyframes revision-arrival {
        from {
          background-color: rgba(34, 197, 94, 0.45);
          box-shadow: 0 0 14px rgba(34, 197, 94, 0.55);
        }
        to {
          background-color: rgba(34, 197, 94, 0.2);
          box-shadow: inset 0 -1px 0 rgba(34, 197, 94, 0.35);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .revision-added { animation: none; }
      }

      /* Light falling across type, now carrying blue: the highlights stay near-white so the letters
         keep their contrast, while the body of the sweep runs through a saturated blue. Mirrored for
         the light theme — dark blue letterforms with pale bands, not the dark version inverted. */
      :root {
        --mark-1: 96 116 160;  --mark-2: 255 255 255; --mark-3: 96 165 250;
        --mark-4: 226 236 252; --mark-5: 96 140 220;
      }
      html.light {
        --mark-1: 71 92 140;  --mark-2: 12 18 38;   --mark-3: 37 99 235;
        --mark-4: 23 34 62;   --mark-5: 88 118 176;
      }
      .wordmark {
        background-image: linear-gradient(104deg,
          rgb(var(--mark-1)) 0%, rgb(var(--mark-2)) 24%, rgb(var(--mark-3)) 46%,
          rgb(var(--mark-4)) 68%, rgb(var(--mark-5)) 100%);
        background-size: 220% 100%;
        background-position: 0% 0;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        transition: background-position 900ms ease;
      }
      .wordmark:hover { background-position: 100% 0; }
      @media (prefers-reduced-motion: reduce) {
        .wordmark { transition: none; }
        .wordmark:hover { background-position: 0% 0; }
      }

      html.light {
        --z-50: 9 9 11;       --z-100: 24 24 27;    --z-200: 39 39 42;
        --z-300: 63 63 70;    --z-400: 82 82 91;    --z-500: 113 113 122;
        --z-600: 161 161 170; --z-700: 212 212 216; --z-800: 228 228 231;
        --z-900: 244 244 245; --z-950: 250 250 250;
        color-scheme: light;
      }
      html, body, #root {
        height: 100%;
        min-height: 100%;
      }
      /* Form controls do not inherit typography by default, which drops them off the grid. */
      button, input, select, textarea {
        font: inherit;
        letter-spacing: inherit;
      }
      body {
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        font-size: 16px;
        line-height: 24px;
      }
      /* Custom scrollbars in zinc dark theme */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgb(var(--z-950)); /* zinc-950 */
      }
      ::-webkit-scrollbar-thumb {
        background: rgb(var(--z-800)); /* zinc-800 */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgb(var(--z-700)); /* zinc-700 */
      }
      /* Fade-in animation */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
      /* Markdown content typography */
      .markdown-content h1 {
        font-size: 1.5rem;
        font-weight: 600;
        color: rgb(var(--z-100));
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
        padding-bottom: 0.35rem;
        border-bottom: 1px solid rgb(var(--z-800));
        font-family: ui-serif, Georgia, Cambria, serif;
      }
      .markdown-content h2 {
        font-size: 1.25rem;
        font-weight: 600;
        color: rgb(var(--z-100));
        margin-top: 1.25rem;
        margin-bottom: 0.5rem;
        font-family: ui-serif, Georgia, Cambria, serif;
      }
      .markdown-content h3 {
        font-size: 1.1rem;
        font-weight: 500;
        color: rgb(var(--z-200));
        margin-top: 1rem;
        margin-bottom: 0.5rem;
        font-family: ui-serif, Georgia, Cambria, serif;
      }
      .markdown-content h4, .markdown-content h5, .markdown-content h6 {
        font-size: 0.95rem;
        font-weight: 500;
        color: rgb(var(--z-300));
        margin-top: 0.75rem;
        margin-bottom: 0.25rem;
      }
      .markdown-content.compact-plan h1,
      .markdown-content.compact-plan h2,
      .markdown-content.compact-plan h3,
      .markdown-content.compact-plan h4,
      .markdown-content.compact-plan h5,
      .markdown-content.compact-plan h6 {
        line-height: 1.3;
        overflow-wrap: anywhere;
        margin-top: 1rem;
        margin-bottom: 0.6rem;
      }
      .markdown-content.compact-plan h1 { font-size: 20px; }
      .markdown-content.compact-plan h2 { font-size: 17px; }
      .markdown-content.compact-plan h3 { font-size: 15px; }
      .markdown-content.compact-plan h1:first-child { margin-top: 0; }
      .markdown-content p {
        font-size: 16px;
        color: rgb(var(--z-300));
        line-height: 28px;
        margin-bottom: 1.25rem;
        text-wrap: pretty;
      }
      /* Book Reader prose typography */
      .markdown-content.text-prose h1 {
        font-size: 1.75rem;
        font-weight: 700;
        text-align: center;
        letter-spacing: -0.02em;
        margin-top: 0.5rem;
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid rgb(var(--z-800));
      }
      .markdown-content.text-prose h2 {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-top: 2.5rem;
        margin-bottom: 1rem;
      }
      .markdown-content.text-prose p,
      .manuscript-changes p {
        font-size: 16px;
        line-height: 28px;
        color: rgb(var(--z-200));
        margin-bottom: 1.25rem;
      }
      .markdown-content.text-xs p,
      .text-xs .markdown-content p,
      .markdown-content.compact-outline p,
      .compact-outline p,
      .markdown-content.compact-plan p {
        line-height: 1.45;
        margin-bottom: 6px;
      }
      .markdown-content.text-xs li,
      .text-xs .markdown-content li,
      .markdown-content.compact-outline li,
      .compact-outline li,
      .markdown-content.compact-plan li {
        line-height: 1.45;
        margin-bottom: 3px;
      }
      /* The chapter plan and story outline panels: text takes the panel's size, not the reader's 16px. */
      .markdown-content.compact-plan p,
      .markdown-content.compact-plan li,
      .markdown-content.compact-outline p,
      .markdown-content.compact-outline li {
        font-size: inherit;
      }
      .markdown-content p:last-child {
        margin-bottom: 0;
      }
      /* The editorial chat: one size for all the assistant writes, in the panel's sans, not the reader's serif. */
      .markdown-content.chat-text { font-size: 13px; line-height: 1.6; color: inherit; }
      .markdown-content.chat-text p,
      .markdown-content.chat-text li { font-size: 13px; line-height: 1.6; color: inherit; }
      .markdown-content.chat-text p { margin-bottom: 10px; }
      .markdown-content.chat-text li { margin-bottom: 4px; }
      .markdown-content.chat-text ul,
      .markdown-content.chat-text ol { margin: 4px 0 10px; color: inherit; }
      .markdown-content.chat-text h1,
      .markdown-content.chat-text h2,
      .markdown-content.chat-text h3,
      .markdown-content.chat-text h4,
      .markdown-content.chat-text h5,
      .markdown-content.chat-text h6 {
        font-family: inherit; font-size: 13px; font-weight: 600; line-height: 1.4;
        color: rgb(var(--z-100)); margin: 18px 0 6px; padding: 0; border: 0;
      }
      .markdown-content.chat-text > div > :first-child { margin-top: 0; }
      .markdown-content.chat-text > div > :last-child { margin-bottom: 0; }
      .markdown-content.chat-text code { font-size: 12px; border: 0; padding: 0.05rem 0.3rem; }
      .markdown-content.chat-text pre { font-size: 12px; line-height: 1.5; border: 0; padding: 8px 10px; margin: 8px 0; background: rgb(var(--z-950) / 0.6); }
      .markdown-content.chat-text blockquote { font-style: normal; background: none; border-left-width: 2px; padding: 0 0 0 10px; margin: 8px 0; }
      .markdown-content.chat-text hr { margin: 12px 0; }
      .markdown-content.chat-text table { font-size: 12px; }
      .markdown-content strong {
        font-weight: 600;
        color: rgb(var(--z-50));
      }
      .markdown-content em {
        font-style: italic;
        color: rgb(var(--z-200));
      }
      .markdown-content ul {
        list-style-type: disc;
        padding-left: 1.25rem;
        margin-top: 0.5rem;
        margin-bottom: 0.75rem;
        color: rgb(var(--z-300));
      }
      .markdown-content ol {
        list-style-type: decimal;
        padding-left: 1.25rem;
        margin-top: 0.5rem;
        margin-bottom: 0.75rem;
        color: rgb(var(--z-300));
      }
      .markdown-content li {
        margin-bottom: 0.25rem;
        line-height: 24px;
      }
      .markdown-content blockquote {
        border-left: 3px solid rgb(var(--z-700));
        padding-left: 1rem;
        padding-top: 0.25rem;
        padding-bottom: 0.25rem;
        margin-top: 0.75rem;
        margin-bottom: 0.75rem;
        color: rgb(var(--z-400));
        background: rgb(var(--z-900) / 0.4);
        font-style: italic;
        border-radius: 0 0.25rem 0.25rem 0;
      }
      .markdown-content hr {
        border: 0;
        border-top: 1px solid rgb(var(--z-800));
        margin: 1.5rem 0;
      }
      .markdown-content code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.85em;
        background: rgb(var(--z-900));
        border: 1px solid rgb(var(--z-800));
        padding: 0.15rem 0.35rem;
        border-radius: 0.25rem;
        color: rgb(var(--z-200));
      }
      .markdown-content pre {
        background: rgb(var(--z-950));
        border: 1px solid rgb(var(--z-800));
        padding: 0.75rem 1rem;
        border-radius: 0.375rem;
        overflow-x: auto;
        margin: 1rem 0;
      }
      .markdown-content pre code {
        background: transparent;
        border: none;
        padding: 0;
      }
      .markdown-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 1rem 0;
        font-size: 0.875rem;
      }
      .markdown-content th, .markdown-content td {
        border: 1px solid rgb(var(--z-800));
        padding: 0.5rem 0.75rem;
        text-align: left;
      }
      .markdown-content th {
        background: rgb(var(--z-900));
        color: rgb(var(--z-100));
        font-weight: 600;
      }

      /* Toolbars wrap between controls; their labels never split inside a fixed-height button. */
      .app-toolbar { max-width: 100%; }
      .app-toolbar > * { flex-shrink: 0; }
      .app-toolbar button, .app-toolbar a, .app-toolbar label, .app-toolbar summary {
        white-space: nowrap; min-height: 28px; height: auto;
      }
      .app-toolbar a, .app-toolbar label { display: inline-flex; align-items: center; }
      .app-shell main, .app-shell header { min-width: 0; }
      input, select, textarea { min-width: 0; max-width: 100%; }
      .studio-layout p, .studio-layout pre, .markdown-content { overflow-wrap: anywhere; }
      @media (max-width: 1023px) {
        .studio-viewport { height: auto; max-height: none; min-height: 100dvh; overflow: visible; }
        .studio-main, .studio-layout { height: auto; overflow: visible; flex: initial; }
        .studio-grid { overflow: visible; flex: initial; grid-template-rows: auto auto auto; }
        .studio-grid > .studio-side { height: 22rem; max-height: 22rem; padding-inline: 0; }
        .studio-grid > .studio-manuscript { height: 65dvh; min-height: 24rem; border-inline: none; }
        .studio-heading { width: 100%; }
      }
      @media (max-width: 479px) {
        .app-shell { padding: 12px; }
        .app-shell > header, .app-shell > main { padding-inline: 0; }
        .studio-header .wordmark { font-size: 18px; }
        .studio-manuscript .text-prose { font-size: 16px; }
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-zinc-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
